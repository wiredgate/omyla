name: Publish Windows Phase 1 Preview

on:
  workflow_run:
    workflows: [Build Windows Presence Preview]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: omyla-windows-release
  cancel-in-progress: false

jobs:
  publish:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Download validated Windows package
        uses: actions/download-artifact@v4
        with:
          name: OMYLA-Windows-Preview
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: dist
      - name: Check package and update preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s dist/OMYLA-Windows-Preview.zip
          unzip -t dist/OMYLA-Windows-Preview.zip
          gh release upload windows-phase1-preview dist/OMYLA-Windows-Preview.zip --clobber
