<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'"><title>OMYLA</title><link rel="stylesheet" href="style.css"></head>
<body><main>
  <section id="panel" hidden><header><strong>OMYLA<span>.</span></strong><button id="close" aria-label="閉じる">×</button></header><label for="goal">いま、何をしたい？</label><textarea id="goal" maxlength="1500" placeholder="ここに話しかけて"></textarea><button id="mic" type="button" aria-pressed="false">🎙 話す</button><small id="mic-status" role="status"></small><div class="canvas-controls"><label for="display">キャンバス</label><select id="display" aria-label="対象ディスプレイ"></select><button id="draw-screen">画面に描く</button><button id="preview-screen">画像確認</button><button id="move-cursor">カーソルを指示位置へ</button><small id="marks-status">線や指示なし</small></div><p>「画面を見て教える」を押すと、選んだ画面を一度撮影してAIへ送信します。案内は実画面に表示され、クリック操作はあなたが行います。「画像確認」はこのPC内のみです。</p><img id="screen-preview" alt="選んだ画面の確認画像" hidden><button id="guide">画面を見て教える</button><button id="next-guide" hidden>次の案内</button><button id="execute-guide" hidden>AIがこの位置をクリック</button><button id="stop-guide" hidden>案内を消す</button><small id="guide-status" role="status"></small><br><button id="send">ブラウザで相談 ↗</button><button id="quit">終了</button><label id="login-option" hidden><input id="login" type="checkbox"> Windows / Mac のログイン時に起動</label></section>
  <button id="orb" aria-label="OMYLAを開く" aria-expanded="false">O</button>
</main><script src="renderer.js"></script></body></html>
