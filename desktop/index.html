<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'"><title>OMYLA</title><link rel="stylesheet" href="style.css"></head>
<body><main>
  <section id="panel" hidden><header><strong>OMYLA<span>.</span></strong><span class="header-actions"><button id="quit" type="button" title="OMYLAを終了">終了</button><button id="close" type="button" aria-label="パネルを閉じる">×</button></span></header><label for="goal">おまいらに頼んで</label><textarea id="goal" maxlength="1500" placeholder="例：このページを開いて、検索欄に岡山を入力して"></textarea><div class="ask-controls"><button id="mic" type="button" aria-pressed="false">🎙 話す</button><button id="ask" type="button">答えて</button><label><input id="screen-context" type="checkbox"> この画面を見せる</label></div><small id="mic-status" role="status"></small><div id="answer" role="status" hidden></div><div class="canvas-controls"><label for="display">キャンバス</label><select id="display" aria-label="対象ディスプレイ"></select><button id="draw-screen">画面に描く</button><button id="preview-screen">画像確認</button><button id="move-cursor">カーソルを指示位置へ</button><small id="marks-status">線や指示なし</small></div><p>画面共有は質問ごとに選べる。撮影した画像は回答のために送信し、保存しない。「画像確認」はこのPC内のみ。</p><img id="screen-preview" alt="選んだ画面の確認画像" hidden><button id="guide">画面を見て教える</button><button id="next-guide" hidden>次の案内</button><button id="execute-guide" hidden>AIがこの位置をクリック</button><button id="stop-guide" hidden>案内を消す</button><small id="guide-status" role="status"></small><br><section class="task-controls"><label><input id="task-consent" type="checkbox"> この作業中、選んだ画面を見せて操作を任せる</label><button id="run-task">Mia、やってきて</button><small id="task-result" role="status"></small><p>クリック・文字入力・スクロールに対応。送信・購入・削除は直前に確認。Ctrl + Alt + S で停止。</p></section><button id="send">ブラウザで相談 ↗</button><label class="wander-option"><input id="wander" type="checkbox"> Miaが画面を歩き回る</label><label id="login-option" hidden><input id="login" type="checkbox"> Windows / Mac のログイン時に起動</label></section>

cx="39" cy="36" rx="3" ry="4" fill="#3d3546"/><ellipse class="eye" cx="61" cy="36" rx="3" ry="4" fill="#3d3546"/><circle cx="38" cy="35" r="1" fill="white"/><circle cx="60" cy="35" r="1" fill="white"/><ellipse cx="29" cy="44" rx="5" ry="2.5" fill="#e798a3" opacity=".5"/><ellipse cx="70" cy="44" rx="5" ry="2.5" fill="#e798a3" opacity=".5"/><path d="M44 46Q50 51 56 46" fill="none" stroke="#a26768" stroke-width="1.7" stroke-linecap="round"/><path d="M22 18Q50 8 77 18" fill="none" stroke="#624940" stroke-width="7"/><g stroke="#d5a360" stroke-width="3"><circle cx="39" cy="15" r="10" fill="#5c8c97"/><circle cx="61" cy="15" r="10" fill="#5c8c97"/></g><path d="M33 12l7-3M56 12l7-3" stroke="#cee3db" stroke-width="2"/><circle cx="77" cy="40" r="3" fill="#d3a764"/></g></svg><span class="crew-name">Mia</span><span id="reaction" aria-live="polite"></span></button>
</main><script src="renderer.js"></script></body></html>
