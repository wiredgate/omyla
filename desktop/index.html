<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'"><title>OMYLA</title><link rel="stylesheet" href="style.css"></head>
<body><main>
  <section id="panel" hidden><header><strong>OMYLA<span>.</span></strong><span class="header-actions"><button id="quit" type="button" title="OMYLAを終了">終了</button><button id="close" type="button" aria-label="パネルを閉じる">×</button></span></header><label for="goal">おまいらに聞いて</label><textarea id="goal" maxlength="1500" placeholder="声でも文字でも、何でも聞いてね"></textarea><div class="ask-controls"><button id="mic" type="button" aria-pressed="false">🎙 話す</button><button id="ask" type="button">答えて</button><label><input id="screen-context" type="checkbox"> この画面を見せる</label></div><small id="mic-status" role="status"></small><div id="answer" role="status" hidden></div><div class="canvas-controls"><label for="display">キャンバス</label><select id="display" aria-label="対象ディスプレイ"></select><button id="draw-screen">画面に描く</button><button id="preview-screen">画像確認</button><button id="move-cursor">カーソルを指示位置へ</button><small id="marks-status">線や指示なし</small></div><p>画面共有は質問ごとに選べる。撮影した画像は回答のために送信し、保存しない。「画像確認」はこのPC内のみ。</p><img id="screen-preview" alt="選んだ画面の確認画像" hidden><button id="guide">画面を見て教える</button><button id="next-guide" hidden>次の案内</button><button id="execute-guide" hidden>AIがこの位置をクリック</button><button id="stop-guide" hidden>案内を消す</button><small id="guide-status" role="status"></small><br><button id="send">ブラウザで相談 ↗</button><label id="login-option" hidden><input id="login" type="checkbox"> Windows / Mac のログイン時に起動</label></section>
  <button id="orb" aria-label="Miaに話しかける。ドラッグして移動" aria-expanded="false"><span class="crew-face" aria-hidden="true"></span><span class="crew-name">Mia</span><span id="reaction" aria-live="polite"></span></button>
</main><script src="renderer.js"></script></body></html>
